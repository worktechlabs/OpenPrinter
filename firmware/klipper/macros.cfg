# OpenDTF - macros de uso diario y de prueba (fase 1)
#
# Posiciones en X (coordenadas de Klipper, ver printer.cfg):
#   centro del film 405 · estación de servicio 810 · film de 600 mm de 105 a 705

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]
[pause_resume]

[gcode_macro _OP]
description: Constantes de la máquina
variable_centro_x: 405
variable_servicio_x: 810
variable_vel_x: 300          # mm/s para desplazamientos (no de impresión)
variable_vel_film: 40        # mm/s de avance del film
gcode:

[gcode_macro _HOME_SI_HACE_FALTA]
gcode:
  {% if "x" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

[gcode_macro _PALANCA_BAJADA]
description: Para la macro si la palanca de presión está levantada
gcode:
  {% if printer["gcode_button palanca_presion"].state != "PRESSED" %}
    { action_raise_error("Baja la palanca de presión antes de mover el film") }
  {% endif %}

# --- Vacío --------------------------------------------------------------------

[gcode_macro VACIO_ON]
description: Enciende el vacío. ANCHO en mm: con film estrecho, solo el centro
gcode:
  {% set ancho = params.ANCHO|default(600)|float %}
  SET_PIN PIN=vacio_central VALUE=1
  SET_PIN PIN=vacio_lateral VALUE={1 if ancho > 420 else 0}

[gcode_macro VACIO_OFF]
description: Apaga el vacío
gcode:
  SET_PIN PIN=vacio_central VALUE=0
  SET_PIN PIN=vacio_lateral VALUE=0

# --- Carro ----------------------------------------------------------------------

[gcode_macro IR_SERVICIO]
description: Lleva el carro a la estación de servicio (home)
gcode:
  {% set op = printer["gcode_macro _OP"] %}
  _HOME_SI_HACE_FALTA
  SAVE_GCODE_STATE NAME=ir_servicio
  G90
  G0 X{op.servicio_x} F{op.vel_x * 60}
  RESTORE_GCODE_STATE NAME=ir_servicio

[gcode_macro IR_CENTRO]
description: Lleva el carro al centro del film (para revisar boquillas o el film)
gcode:
  {% set op = printer["gcode_macro _OP"] %}
  _HOME_SI_HACE_FALTA
  SAVE_GCODE_STATE NAME=ir_centro
  G90
  G0 X{op.centro_x} F{op.vel_x * 60}
  RESTORE_GCODE_STATE NAME=ir_centro

# --- Film -------------------------------------------------------------------------

[gcode_macro AVANZAR_FILM]
description: Avanza el film MM milímetros (negativo para retroceder)
gcode:
  {% set op = printer["gcode_macro _OP"] %}
  {% set mm = params.MM|default(100)|float %}
  {% set vel = params.VEL|default(op.vel_film)|float %}
  _PALANCA_BAJADA
  SAVE_GCODE_STATE NAME=avanzar_film
  G91
  G1 Y{mm} F{vel * 60}
  RESTORE_GCODE_STATE NAME=avanzar_film

[gcode_macro CARGAR_FILM]
description: Después de pasar el film y bajar la palanca: lo tensa y lo deja listo
gcode:
  _PALANCA_BAJADA
  IR_SERVICIO
  AVANZAR_FILM MM=150 VEL=20
  VACIO_ON ANCHO={params.ANCHO|default(600)}
  G92 Y0
  RESPOND MSG="Film cargado. Comprueba que va recto en la rampa de salida."

# --- Trabajos -------------------------------------------------------------------------

[gcode_macro INICIO_TRABAJO]
description: Al empezar un trabajo: home, vacío y Y = 0
gcode:
  _HOME_SI_HACE_FALTA
  _PALANCA_BAJADA
  VACIO_ON ANCHO={params.ANCHO|default(600)}
  G90
  G92 Y0

[gcode_macro FIN_TRABAJO]
description: Al acabar: saca el impreso por la rampa, apaga el vacío y aparca
gcode:
  {% if printer["gcode_button palanca_presion"].state == "PRESSED" %}
    AVANZAR_FILM MM={params.SALIDA|default(150)}
  {% endif %}
  VACIO_OFF
  IR_SERVICIO

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  IR_SERVICIO

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  RESUME_BASE

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE
  FIN_TRABAJO SALIDA=0

# --- Pruebas de la fase 1 (docs/fase1_movimiento.md) ----------------------------------

[gcode_macro PRUEBA_PASADAS]
description: N pasadas del carro de lado a lado a VEL mm/s (prueba 1)
gcode:
  {% set n = params.N|default(100)|int %}
  {% set vel = params.VEL|default(600)|float %}
  _HOME_SI_HACE_FALTA
  SAVE_GCODE_STATE NAME=prueba_pasadas
  G90
  G0 X20 F{300 * 60}
  {% for i in range(n) %}
    G1 X790 F{vel * 60}
    G1 X20 F{vel * 60}
  {% endfor %}
  M400
  RESTORE_GCODE_STATE NAME=prueba_pasadas
  IR_SERVICIO
  RESPOND MSG="{n} pasadas hechas a {vel} mm/s"

[gcode_macro PRUEBA_AVANCE]
description: N avances de PASO mm con pausa, para medir el film con calibre (prueba 2)
gcode:
  {% set n = params.N|default(100)|int %}
  {% set paso = params.PASO|default(6.35)|float %}
  _PALANCA_BAJADA
  SAVE_GCODE_STATE NAME=prueba_avance
  G91
  {% for i in range(n) %}
    G1 Y{paso} F{10 * 60}
    G4 P200
  {% endfor %}
  M400
  RESTORE_GCODE_STATE NAME=prueba_avance
  RESPOND MSG="Avance ordenado: {n * paso} mm. Mide la marca del film y compara."
