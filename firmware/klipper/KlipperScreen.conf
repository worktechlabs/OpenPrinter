# OpenDTF - menú de KlipperScreen para la pantalla táctil de 7"
#
# Se copia a ~/printer_data/config/KlipperScreen.conf. Añade un menú
# "OpenDTF" a la pantalla principal con las funciones básicas. Las
# opciones que mueven el film o vacían piden confirmación.

[main]
language: es
show_heater_power: False

[menu __main opendtf]
name: OpenDTF
icon: settings

[menu __main opendtf home]
name: Home del carro
icon: home
method: printer.gcode.script
params: {"script": "G28"}

[menu __main opendtf cargar]
name: Cargar film
icon: load
method: printer.gcode.script
params: {"script": "CARGAR_FILM"}
confirm: ¿Has pasado el film bajo las ruedas y bajado la palanca?

[menu __main opendtf avanzar]
name: Avanzar 10 cm
icon: arrow-down
method: printer.gcode.script
params: {"script": "AVANZAR_FILM MM=100"}

[menu __main opendtf retroceder]
name: Retroceder 1 cm
icon: arrow-up
method: printer.gcode.script
params: {"script": "AVANZAR_FILM MM=-10 VEL=10"}

[menu __main opendtf vacio_on]
name: Vacío ON
icon: fan
method: printer.gcode.script
params: {"script": "VACIO_ON"}

[menu __main opendtf vacio_off]
name: Vacío OFF
icon: fan-off
method: printer.gcode.script
params: {"script": "VACIO_OFF"}

[menu __main opendtf servicio]
name: Ir a servicio
icon: home
method: printer.gcode.script
params: {"script": "IR_SERVICIO"}

[menu __main opendtf centro]
name: Carro al centro
icon: move
method: printer.gcode.script
params: {"script": "IR_CENTRO"}

[menu __main opendtf tinta]
name: Tinta
icon: filament

[menu __main opendtf tinta estado]
name: Estado
icon: info
method: printer.gcode.script
params: {"script": "TINTA_ESTADO"}

[menu __main opendtf tinta rearmar]
name: Botella cambiada
icon: refresh
method: printer.gcode.script
params: {"script": "TINTA_REARMAR"}
confirm: ¿Has cambiado la botella o purgado el aire del tubo?

[menu __main opendtf tinta parar]
name: Parar bombas
icon: stop
method: printer.gcode.script
params: {"script": "TINTA_PARAR"}

[menu __main opendtf tinta activar]
name: Activar bombas
icon: resume
method: printer.gcode.script
params: {"script": "TINTA_ACTIVAR"}

[menu __main opendtf prueba]
name: Prueba de pasadas
icon: move
method: printer.gcode.script
params: {"script": "PRUEBA_PASADAS N=20 VEL=300"}
confirm: El carro va a moverse de lado a lado 20 veces. ¿Vía libre?
