# OpenPrinter - configuración de Klipper (fase 1: movimiento, vacío y tinta)
#
# Placa: BTT SKR Mini E3 V3.0 (STM32G0B1) + Raspberry Pi 3 como host y como
# segunda MCU (GPIO para bombas y flotadores de tinta).
# Sin probar en la máquina: los pines salen de la configuración de ejemplo de
# Klipper para esta placa (config/generic-bigtreetech-skr-mini-e3-v3.0.cfg).
# Revísalos con tu placa antes de conectar motores.
#
# Coordenadas de Klipper (mm):
#   X = 0 en el extremo izquierdo del recorrido del carro (X_MIN de params.py).
#       El centro del film queda en X = 405 y la estación de servicio (home)
#       en X = 810. Recorrido total 820 mm.
#   Y = avance del film. No tiene final: se pone a 0 al empezar cada trabajo.
#   Z no existe: Klipper exige un eje Z en cinemática cartesiana, así que se
#       declara en el driver Z libre, sin motor, y nunca se mueve.

# No se incluye mainsail.cfg: sus macros de pausa esperan un extrusor. Las
# equivalentes están en macros.cfg.
[include tinta.cfg]
[include macros.cfg]

[mcu]
# ls /dev/serial/by-id/  y copia aquí el nombre del dispositivo
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_CAMBIAR-if00

[mcu host]
# La Raspberry Pi como MCU (servicio klipper-mcu): bombas y flotadores de tinta
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 650           # 0,6 m/s de impresión + margen
max_accel: 6000             # frena de 0,6 m/s en 30 mm, dentro de los 60 de ACCEL_ZONE
max_z_velocity: 1
max_z_accel: 1
square_corner_velocity: 5

# --- Eje X: carro (motor X a la izquierda, correa GT2 10 mm, polea 20T) -------

[stepper_x]
step_pin: PB13
dir_pin: !PB12               # si al hacer home el carro va hacia la izquierda, quita o pon el "!"
enable_pin: !PB14
microsteps: 16
rotation_distance: 40        # GT2 x 20 dientes
endstop_pin: ^PC0            # X-STOP: sensor de horquilla del soporte del tensor
position_min: 0
position_endstop: 815        # calibrar: la bandera entra en la horquilla entre 814 y 820
position_max: 820
homing_positive_dir: true
homing_speed: 40
second_homing_speed: 5
homing_retract_dist: 8

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.8             # NEMA17 de 40 mm; subir si pierde pasos a 0,6 m/s
interpolate: true
stealthchop_threshold: 0     # spreadCycle: más par a velocidad

# --- Eje Y: arrastre del film (rodillo Ø30, reducción 4:1) --------------------

[stepper_y]
step_pin: PB10
dir_pin: !PB2                # el film debe avanzar hacia delante con Y positivo
enable_pin: !PB11
microsteps: 16
rotation_distance: 94.2478   # circunferencia del rodillo Ø30
gear_ratio: 80:20            # polea del rodillo : polea del motor
endstop_pin: ^PC2            # Z-STOP libre: Klipper lo exige, pero Y nunca hace home
position_min: -1000
position_endstop: 0
position_max: 200000         # 200 m de film por trabajo
homing_speed: 20

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.6
interpolate: true
stealthchop_threshold: 999999   # silencioso: el avance es lento

# --- Z ficticio en el driver Z libre (sin motor) -------------------------------

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC14           # conector PROBE libre: Z nunca hace home
position_endstop: 0
position_max: 1

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.1

# Solo X hace home de verdad. Y y Z se dan por puestos a 0.
[homing_override]
axes: xyz
set_position_y: 0
set_position_z: 0
gcode:
  G28 X

# --- Vacío de la mesa: 4 ventiladores de 24 V en dos grupos -------------------
# Las salidas de calentador de la SKR son MOSFET de 24 V. Se usan como salidas
# simples: no hay calentadores en esta máquina.

[output_pin vacio_central]
pin: PC8                     # HE0: los dos ventiladores del centro
value: 0

[output_pin vacio_lateral]
pin: PC9                     # HB: los dos de los lados (solo con film de 60 cm)
value: 0

[controller_fan electronica]
pin: PC6                     # FAN0: ventiladores 4010 de la caja (12 V por el convertidor)
idle_timeout: 120
stepper: stepper_x, stepper_y

# --- Sensores -------------------------------------------------------------------

[filament_switch_sensor film]
switch_pin: ^PC15            # E0-STOP: TCRT5000 bajo la mesa de entrada
pause_on_runout: true
runout_gcode:
  RESPOND TYPE=error MSG="Se ha acabado el film o no está bajo el sensor"

[gcode_button palanca_presion]
pin: ^PC1                    # Y-STOP: microinterruptor de la palanca de levante
press_gcode:
  RESPOND MSG="Palanca bajada: ruedas apretando el film"
release_gcode:
  RESPOND TYPE=error MSG="Palanca levantada: el film no avanza"

# --- Varios -----------------------------------------------------------------------

[idle_timeout]
timeout: 1800
gcode:
  VACIO_OFF
  M84

[respond]
[exclude_object]
[gcode_arcs]
