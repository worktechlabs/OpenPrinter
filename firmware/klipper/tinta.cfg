# OpenDTF - relleno automático de tinta
#
# Cada color: botella de 1 L -> bomba peristáltica 12 V -> subdepósito con
# flotador a altura fija -> cabezal. Las bombas y los flotadores van a los GPIO
# de la Raspberry Pi ([mcu host]); las bombas, a través de un módulo MOSFET o un
# ULN2803.
#
# Cada 2 s se mira cada flotador. Si el subdepósito no está lleno, su bomba
# funciona. Si pasa MAX_S segundos sin llenarse, se para y avisa: botella vacía,
# tubo con aire o bomba atascada. TINTA_REARMAR quita el aviso.
#
# Cableado de los flotadores: entre el GPIO y GND, con una resistencia de 10 kΩ
# del GPIO a 3,3 V. Con el flotador arriba (lleno) el contacto debe cerrar; si
# el tuyo funciona al revés, quita el "!" del pin.

# GPIO (numeración BCM) de la Raspberry Pi
#   Bombas:     C 17 · M 27 · Y 22 · K 23 · W 24
#   Flotadores: C 5  · M 6  · Y 13 · K 19 · W 26

[output_pin bomba_c]
pin: host:gpio17
value: 0
[output_pin bomba_m]
pin: host:gpio27
value: 0
[output_pin bomba_y]
pin: host:gpio22
value: 0
[output_pin bomba_k]
pin: host:gpio23
value: 0
[output_pin bomba_w]
pin: host:gpio24
value: 0

[gcode_macro _NADA]
gcode:

[gcode_button flotador_c]
pin: !host:gpio5
press_gcode: _NADA
[gcode_button flotador_m]
pin: !host:gpio6
press_gcode: _NADA
[gcode_button flotador_y]
pin: !host:gpio13
press_gcode: _NADA
[gcode_button flotador_k]
pin: !host:gpio19
press_gcode: _NADA
[gcode_button flotador_w]
pin: !host:gpio26
press_gcode: _NADA

[gcode_macro _TINTA]
description: Estado del relleno de tinta (lo usan las demás macros)
variable_activo: True
variable_periodo: 2
variable_max_s: 90           # tiempo máximo de bomba seguido por color
variable_t_c: 0              # segundos de bomba seguidos; -1 = en aviso
variable_t_m: 0
variable_t_y: 0
variable_t_k: 0
variable_t_w: 0
gcode:

[delayed_gcode _TINTA_CICLO]
initial_duration: 10
gcode:
  {% set v = printer["gcode_macro _TINTA"] %}
  {% for c in ["c", "m", "y", "k", "w"] %}
    {% set lleno = printer["gcode_button flotador_" ~ c].state == "PRESSED" %}
    {% set t = v["t_" ~ c] %}
    {% if lleno %}
      SET_PIN PIN=bomba_{c} VALUE=0
      {% if t != 0 %}
        SET_GCODE_VARIABLE MACRO=_TINTA VARIABLE=t_{c} VALUE=0
      {% endif %}
    {% elif not v.activo or t < 0 %}
      SET_PIN PIN=bomba_{c} VALUE=0
    {% elif t >= v.max_s %}
      SET_PIN PIN=bomba_{c} VALUE=0
      SET_GCODE_VARIABLE MACRO=_TINTA VARIABLE=t_{c} VALUE=-1
      RESPOND TYPE=error MSG="Tinta {c|upper}: el subdepósito no se llena. ¿Botella vacía o aire en el tubo? Revisa y usa TINTA_REARMAR."
    {% else %}
      SET_PIN PIN=bomba_{c} VALUE=1
      SET_GCODE_VARIABLE MACRO=_TINTA VARIABLE=t_{c} VALUE={t + v.periodo}
    {% endif %}
  {% endfor %}
  UPDATE_DELAYED_GCODE ID=_TINTA_CICLO DURATION={v.periodo}

[gcode_macro TINTA_ESTADO]
description: Nivel de cada subdepósito y estado de su bomba
gcode:
  {% set v = printer["gcode_macro _TINTA"] %}
  {% set lineas = [] %}
  {% for c in ["c", "m", "y", "k", "w"] %}
    {% set lleno = printer["gcode_button flotador_" ~ c].state == "PRESSED" %}
    {% set t = v["t_" ~ c] %}
    {% set estado = "lleno" if lleno else ("AVISO" if t < 0 else ("rellenando " ~ t ~ " s" if v.activo else "bajo, relleno parado")) %}
    {% set _ = lineas.append(c|upper ~ ": " ~ estado) %}
  {% endfor %}
  RESPOND MSG="Tinta ({'activo' if v.activo else 'parado'}) - {lineas|join(' · ')}"

[gcode_macro TINTA_PARAR]
description: Para todas las bombas y el relleno automático
gcode:
  SET_GCODE_VARIABLE MACRO=_TINTA VARIABLE=activo VALUE=False
  {% for c in ["c", "m", "y", "k", "w"] %}
    SET_PIN PIN=bomba_{c} VALUE=0
  {% endfor %}
  RESPOND MSG="Relleno de tinta parado"

[gcode_macro TINTA_ACTIVAR]
description: Vuelve a activar el relleno automático
gcode:
  SET_GCODE_VARIABLE MACRO=_TINTA VARIABLE=activo VALUE=True
  RESPOND MSG="Relleno de tinta activo"

[gcode_macro TINTA_REARMAR]
description: Quita los avisos (después de cambiar una botella o purgar aire)
gcode:
  {% for c in ["c", "m", "y", "k", "w"] %}
    SET_GCODE_VARIABLE MACRO=_TINTA VARIABLE=t_{c} VALUE=0
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_TINTA VARIABLE=activo VALUE=True
  RESPOND MSG="Avisos de tinta borrados; relleno activo"
